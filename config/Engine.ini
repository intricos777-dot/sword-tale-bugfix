; Sword Tale: Lost Excalibur — Engine.ini (Linux/Proton optimization overlay)
; Target: Unreal Engine 4.18.3 (Steam App 3305630)
; Install location:
;   <prefix>/pfx/drive_c/users/steamuser/AppData/Local/SwordTale/Saved/Config/WindowsNoEditor/Engine.ini
; Installed via install-configs.sh — backups are created automatically.
;
; Sections in this file are only applied when they are absent from the game's own
; generated settings (UE merges: Engine -> BaseEngine -> platform -> Saved). Keep
; values conservative. `#` is a comment.

[SystemSettings]
; VSync off (launch option -novsync covers it too; belt and braces)
r.VSync=0
; Keep GPU one frame behind: smoother frame pacing
r.OneFrameThreadLag=1
; Native resolution percentage (leave at 100 unless using FSR)
r.ScreenPercentage=100
; --- Texture streaming for 4 GB VRAM / 8 GB RAM systems ---
; UE4.18 drives this from VRAM size; on a 4 GB GPU the default pool can exceed
; comfortable RAM limits and feed the boot render-thread stall (ST-011).
; 2048 MB of streaming pool is a sane cap for 4 GB cards; lower to 1536 if crashes persist.
r.Streaming.PoolSize=2048
r.Streaming.MaxTempMemoryAllowed=192
r.Streaming.NumStaticComponentsProcessedPerFrame=8
; Slightly fewer mip levels in flight -> less streaming hitches on HDD/NVMe under Wine
r.Streaming.MipBias=0
; --- Audio ---
; Reduce start-up audio decode thread pressure
s.FastDecodeAudio=1

; Don't fight the window manager on this old engine under Wayland/X11
[WindowsApplication.Accessibility]
StickyKeysHotkey=False
ToggleKeysHotkey=False
FilterKeysHotkey=False
StickyKeysConfirmation=False
ToggleKeysConfirmation=False
FilterKeysConfirmation=False